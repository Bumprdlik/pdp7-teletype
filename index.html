<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teletype 33</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141311; }
  body { font: 13px/1.4 system-ui, sans-serif; color: #b9b4a8; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 8px; align-items: center;
         padding: 8px 14px; background: linear-gradient(#000c, #0000); }
  #bar button { font: inherit; color: #ddd8cc; background: #2a2824; border: 1px solid #4a463e; border-radius: 4px;
                padding: 4px 10px; cursor: pointer; }
  #bar button.on { background: #6b4f1d; border-color: #a77c2c; }
  #bar .hint { margin-left: auto; opacity: .7; }
  :root { --manw: clamp(360px, 40vw, 640px); }
  #stage { position: absolute; inset: 0; perspective: 1300px; display: flex; justify-content: center; align-items: flex-end;
           transition: padding-left .25s ease; }
  body.manopen #stage { padding-left: var(--manw); }
  #tilt { transform-origin: 50% 100%; transform: rotateX(13deg); }
  canvas { display: block; }
  #back { position: fixed; bottom: 18px; right: 18px; z-index: 3; display: none; padding: 6px 12px; border-radius: 4px;
          background: #2a2824e6; border: 1px solid #a77c2c; color: #ddd8cc; cursor: pointer; }
  #man { position: fixed; top: 44px; left: 0; bottom: 0; width: var(--manw); z-index: 5; display: flex; flex-direction: column;
         background: #1d1b18f2; border-right: 1px solid #4a463e; transform: translateX(-100%); transition: transform .25s ease;
         box-shadow: 12px 0 30px #0008; }
  #man.open { transform: none; }
  #manList, #manPage { scrollbar-width: none; }
  #manList::-webkit-scrollbar, #manPage::-webkit-scrollbar { display: none; }
  #man header { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid #3a372f; }
  #man input { flex: 1; font: 14px system-ui, sans-serif; color: #eee8da; background: #2a2824; border: 1px solid #4a463e;
               border-radius: 4px; padding: 6px 9px; outline: none; }
  #man input:focus { border-color: #a77c2c; }
  #man header button, #manList button { font: inherit; color: #ddd8cc; background: #2a2824; border: 1px solid #4a463e;
               border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  #manList { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-bottom: 1px solid #3a372f; max-height: 30%; overflow: auto; }
  #manList button.sel { background: #6b4f1d; border-color: #a77c2c; }
  #manList button small { opacity: .65; margin-left: 4px; }
  #manList .none { opacity: .6; padding: 4px; }
  #manPage { flex: 1; overflow: auto; margin: 10px; padding: 18px 20px; background: #efe9dc; color: #1d1b1f; border-radius: 2px;
             font: 14px/1.45 "Courier New", "Nimbus Mono PS", "Liberation Mono", monospace; }
  #manPage .hdr { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 1.2em; }
  #manPage .pre { white-space: pre-wrap; }
  #manPage .tips { white-space: pre-wrap; padding-left: 13ch; text-indent: -13ch; }
  #manPage .para { white-space: normal; }
  #manPage .sp { height: .9em; }
  #manPage mark { background: #f2c14e; color: inherit; }
  #power { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
           background: #000a; }
  #power button { font: 600 20px system-ui; letter-spacing: .1em; padding: 18px 34px; color: #f0e6cc;
                  background: #3b2a10; border: 2px solid #a77c2c; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="bar">
  <button id="bTurbo" title="F5">Turbo</button>
  <button id="bLid" title="F7">Lid</button>
  <button id="bTear">Tear off paper</button>
  <button id="bMan" title="F2">Manual</button>
  <button id="bReset" title="power-cycles the PDP-7 (the disk is saved)">Restart computer</button>
  <span class="hint">F8 = next carriage sound (<b id="crName">cr_1.wav</b>)</span>
  <span class="hint">login: ken / ken · Backspace = # · stuck? → Restart computer</span>
</div>
<div id="stage"><div id="tilt"><canvas id="c"></canvas></div></div>
<aside id="man">
  <header><input id="manQ" type="search" placeholder="Search the manual…" autocomplete="off"><button id="manClose" title="Esc">✕</button></header>
  <div id="manList"></div>
  <div id="manPage"></div>
</aside>
<div id="back">Scrolled back · End or any key returns</div>
<div id="power"><button id="bPower">POWER ON TELETYPE</button></div>

<script>
"use strict";
// ---------- dimensions (Model 33: 72 chars per line, 10 chars/inch, 6 lines/inch) ----------
const COLS = 72, FONT_PX = 21;
const FONT = `bold ${FONT_PX}px "Courier New", "Nimbus Mono PS", "Liberation Mono", monospace`;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.font = FONT;
const CW = Math.round(ctx.measureText("M").width * 1.04), LH = Math.round(CW * 1.66);
const MARGIN = 70, W = MARGIN * 2 + COLS * CW;
let H = 0, PRINT_Y = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const manW = document.body.classList.contains("manopen") ? document.getElementById("man").offsetWidth : 0;
  const scale = Math.min(1, (window.innerWidth - manW - 24) / W);
  H = Math.round((window.innerHeight - 10) / scale);
  PRINT_Y = H - 120;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  dirty = true;
}

// ---------- pseudo-random wear: every character on the type cylinder is worn a bit differently ----------
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; }
const glyphWear = {};
for (let c = 32; c < 128; c++) glyphWear[c] = { dy: (hash(c) - .5) * 2.4, dx: (hash(c + 999) - .5) * 1.2, ink: .82 + hash(c + 77) * .18 };
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- paper ----------
let lines, cur, col, dirty = true, scrollAnim = 0, headX = MARGIN, ribbon = 1;
let viewOff = 0, viewTarget = 0;   // mouse-wheel scrollback (pixels the paper is pulled back down)
function newPaper() { lines = [mkLine()]; cur = 0; viewOff = viewTarget = 0; dirty = true; const b = document.getElementById("back"); if (b) b.style.display = "none"; }
function mkLine() { return { strikes: [], cache: null, dirty: true }; }

const paperTex = (() => {               // paper texture (fibres + noise), tiled
  const t = document.createElement("canvas"); t.width = 256; t.height = 256;
  const g = t.getContext("2d"), img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 238 + (Math.random() - .5) * 10;
    img.data[i] = v; img.data[i + 1] = v - 3; img.data[i + 2] = v - 11; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = .05;
  for (let i = 0; i < 90; i++) { g.strokeStyle = Math.random() < .5 ? "#776" : "#fff"; g.beginPath();
    const x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y); g.lineTo(x + rnd(-30, 30), y + rnd(-4, 4)); g.stroke(); }
  return t;
})();
let paperPattern = null;

function strike(ch) {
  const code = ch.charCodeAt(0), wear = glyphWear[code] || glyphWear[63];
  const c = Math.min(col, COLS - 1);         // at end of line it overprints the last column
  const ink = wear.ink * rnd(.62, 1) * ribbon;
  lines[cur].strikes.push({
    ch, col: c,
    dx: wear.dx + rnd(-.6, .6), dy: wear.dy + rnd(-.9, .9), r: rnd(-.025, .025),
    a1: ink * rnd(.55, 1), a2: ink * rnd(.55, 1), heavy: Math.random() < .35,
  });
  lines[cur].dirty = true;
  ribbon = Math.max(.75, ribbon - .00002);   // the ribbon slowly fades
}

function renderLine(L) {
  if (!L.cache) { L.cache = document.createElement("canvas"); L.cache.width = W * DPR; L.cache.height = LH * 2 * DPR; }
  const g = L.cache.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, LH * 2);
  g.font = FONT; g.textBaseline = "alphabetic";
  for (const s of L.strikes) {
    g.save();
    g.translate(MARGIN + s.col * CW + s.dx, LH * 1.35 + s.dy);
    g.rotate(s.r);
    const grad = g.createLinearGradient(0, -FONT_PX * .8, CW * .4, 0);   // uneven strike
    grad.addColorStop(0, `rgba(22,20,24,${s.a1})`); grad.addColorStop(1, `rgba(22,20,24,${s.a2})`);
    g.fillStyle = grad; g.strokeStyle = grad; g.lineJoin = "round";
    g.shadowColor = `rgba(22,20,24,${(s.a1 + s.a2) * .45})`; g.shadowBlur = 2.4;   // ink bleed
    g.lineWidth = s.heavy ? 1.9 : 1.3;                                             // heavy embossed type
    g.strokeText(s.ch, 0, 0);
    g.fillText(s.ch, 0, 0);
    if (s.heavy) { g.shadowBlur = 0; g.fillText(s.ch, .6, .3); }
    g.restore();
  }
  L.dirty = false;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const paperBottom = PRINT_Y + 16;
  // paper (texture scrolls with the text)
  if (!paperPattern) paperPattern = ctx.createPattern(paperTex, "repeat");
  const shift = (((cur * LH - scrollAnim - viewOff) % 256) + 256) % 256;
  ctx.save();
  ctx.beginPath(); ctx.rect(30, 0, W - 60, paperBottom); ctx.clip();
  ctx.translate(0, -shift); ctx.fillStyle = paperPattern; ctx.fillRect(0, shift - 256, W, paperBottom + 512);
  ctx.restore();
  // lines
  for (let i = cur; i >= 0; i--) {
    const y = PRINT_Y - (cur - i) * LH + scrollAnim + viewOff - LH * 1.35;
    if (y < -LH * 2) break;
    if (y > H) continue;                      // pulled down behind the platen
    const L = lines[i];
    if (L.dirty) renderLine(L);
    ctx.drawImage(L.cache, 0, y, W, LH * 2);
  }
  // shading at the top (paper curves away from the camera) and roll edges
  let g = ctx.createLinearGradient(0, 0, 0, H * .45);
  g.addColorStop(0, "rgba(10,9,8,.85)"); g.addColorStop(1, "rgba(10,9,8,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * .45);
  g = ctx.createLinearGradient(30, 0, W - 30, 0);
  g.addColorStop(0, "rgba(0,0,0,.35)"); g.addColorStop(.06, "rgba(0,0,0,0)");
  g.addColorStop(.94, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.35)");
  ctx.fillStyle = g; ctx.fillRect(30, 0, W - 60, paperBottom);
  // paper bail above the print line
  // centre of the gap between the 3rd and 4th line above the print line (baseline + half the gap)
  const capH = FONT_PX * .62, bailY = PRINT_Y - LH * 3 + (LH - capH) / 2 + 1.5;
  g = ctx.createLinearGradient(0, bailY - 2.5, 0, bailY + 2.5);
  g.addColorStop(0, "#fafafa"); g.addColorStop(.5, "#9a9a9a"); g.addColorStop(1, "#3a3a3a");
  ctx.fillStyle = g; ctx.fillRect(0, bailY - 2.5, W, 5);
  ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.fillRect(30, bailY + 2.5, W - 60, 3);
  // platen
  g = ctx.createLinearGradient(0, paperBottom, 0, H);
  g.addColorStop(0, "#2c2b29"); g.addColorStop(.25, "#0d0d0c"); g.addColorStop(.6, "#1d1c1a"); g.addColorStop(1, "#050505");
  ctx.fillStyle = g; ctx.fillRect(0, paperBottom, W, H - paperBottom);
  // print head with type cylinder
  headX += (MARGIN + Math.min(col, COLS - 1) * CW - headX) * .35;
  drawHead(headX + CW / 2, PRINT_Y + 18);
}

function drawHead(x, y) {
  ctx.save();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect(x - 70, y - 8, 140, 22, 6); ctx.fill();   // ribbon guide
  ctx.fillStyle = "#1c1a1c"; ctx.fillRect(x - 90, y - 6, 180, 6);                                 // ribbon
  const g = ctx.createRadialGradient(x - 8, y + 30, 4, x, y + 38, 40);
  g.addColorStop(0, "#5b5b5b"); g.addColorStop(.5, "#202020"); g.addColorStop(1, "#050505");
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y + 40, 34, 42, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(200,200,200,.18)";                                                       // characters on the cylinder
  for (let r = 0; r < 6; r++) for (let k = -3; k <= 3; k++) ctx.fillRect(x + k * 8 - 2, y + 14 + r * 9, 4, 5);
  ctx.fillStyle = "#9a9a9a"; ctx.beginPath(); ctx.arc(x, y + 16, 7, 0, Math.PI * 2); ctx.fill();   // hub nut
  ctx.restore();
}

// ---------- sound (synthesized, no recordings needed) ----------
const S = { ctx: null };
function initAudio() {
  const a = S.ctx = new (window.AudioContext || window.webkitAudioContext)();
  S.master = a.createGain(); S.master.gain.value = .8; S.master.connect(a.destination);
  const len = a.sampleRate * 2; S.noise = a.createBuffer(1, len, a.sampleRate);
  const d = S.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  loadSamples();
}
// ---------- optional recorded samples (sounds/*.wav) ----------
const SMP = { strike: [], cr: [], motor: null };
async function loadSamples() {
  let names = [];
  try { names = await (await fetch("/sounds.json")).json(); } catch (e) {}
  await Promise.all(names.map(async (n) => {
    try {
      const buf = await S.ctx.decodeAudioData(await (await fetch("/sounds/" + n)).arrayBuffer());
      if (n.startsWith("strike")) SMP.strike.push(buf);
      else if (n.startsWith("cr")) SMP.cr.push({ n, buf });
      else if (n.startsWith("motor")) SMP.motor = buf;
    } catch (e) { console.warn("sample", n, e); }
  }));
  SMP.cr.sort((a, b) => a.n.localeCompare(b.n));
  startMotor();
}
function startMotor() {
  const a = S.ctx;
  if (SMP.motor) {                              // recorded motor loop
    const src = a.createBufferSource(); src.buffer = SMP.motor; src.loop = true;
    const g = a.createGain(); g.gain.value = .32; src.connect(g).connect(S.master); src.start();
  } else {                                      // synthesized motor
    const n = a.createBufferSource(); n.buffer = S.noise; n.loop = true;
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
    const mg = a.createGain(); mg.gain.value = .12; n.connect(lp).connect(mg).connect(S.master); n.start();
    const o = a.createOscillator(); o.frequency.value = 60; const og = a.createGain(); og.gain.value = .04;
    o.connect(og).connect(S.master); o.start();
  }
}
function playBuf(buf, gain, rate = 1, delay = 0) {
  const a = S.ctx, src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf; src.playbackRate.value = rate; g.gain.value = gain;
  src.connect(g).connect(S.master); src.start(a.currentTime + delay);
}
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
let crChoice = 0;   // which carriage-return sample is used (F8 cycles)
function burst(freq, q, dur, gain, delay = 0, type = "bandpass") {
  const a = S.ctx, t = a.currentTime + delay;
  const src = a.createBufferSource(); src.buffer = S.noise;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f).connect(g).connect(S.master); src.start(t, Math.random() * 1.5, dur + .05);
}
function thump(freq, dur, gain, delay = 0) {
  const a = S.ctx, t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .6, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(S.master); o.start(t); o.stop(t + dur + .02);
}
const snd = {
  strike() { burst(rnd(2000, 3400), 1.1, .035, .9); burst(rnd(650, 950), 2, .06, .45, .004); thump(rnd(100, 140), .05, .5); },
  space() { burst(rnd(800, 1000), 1.5, .03, .3); thump(90, .03, .2); },
  cr() {    // carriage slides left and bangs
    const a = S.ctx, t = a.currentTime, src = a.createBufferSource(); src.buffer = S.noise;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(350, t); f.frequency.linearRampToValueAtTime(1500, t + .2);
    const g = a.createGain(); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.01, t + .24);
    src.connect(f).connect(g).connect(S.master); src.start(t, Math.random(), .3);
    burst(900, 1, .12, 1, .2); thump(75, .14, .9, .2);
  },
  lf() { burst(1300, 3, .05, .5); thump(170, .04, .3); },
  bell() { for (const [fr, gn] of [[1250, .25], [2510, .1]]) { const a = S.ctx, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.frequency.value = fr; g.gain.setValueAtTime(gn, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.3); o.connect(g).connect(S.master); o.start(t); o.stop(t + 1.4); } },
};
function play(name) {
  if (!S.ctx) return;
  if (SMP.strike.length) {
    if (name === "strike") return playBuf(pick(SMP.strike), rnd(.75, 1), rnd(.96, 1.04));
    if (name === "space") return playBuf(pick(SMP.strike), rnd(.25, .35), rnd(.85, .9));
    if (name === "lf") return playBuf(pick(SMP.strike), .45, rnd(.7, .75));
    if (name === "cr" && SMP.cr.length) return playBuf(SMP.cr[crChoice % SMP.cr.length].buf, .9);
  }
  snd[name]();
}

// ---------- printing at 10 chars per second ----------
const queueOut = []; let turbo = false, lid = false, budget = 0, last = 0;
function out(ch, sound) {
  const code = ch.charCodeAt(0) & 0x7f;
  if (code === 13) { col = 0; if (sound) play("cr"); }
  else if (code === 10) { lines.push(mkLine()); cur++; scrollAnim += LH; if (lines.length > 3000) { lines.splice(0, 1000); cur -= 1000; } if (sound) play("lf"); }
  else if (code === 7) { if (sound) play("bell"); }
  else if (code === 9) { do { col++; } while (col % 8 && col < COLS); if (sound) play("space"); }
  else if (code === 32) { col = Math.min(col + 1, COLS); if (sound) play("space"); }
  else if (code > 32 && code < 127) {
    strike(String.fromCharCode(code).toUpperCase());   // the Model 33 prints upper case only
    col = Math.min(col + 1, COLS);
    if (sound) play("strike");
  }
  dirty = true;
}
function frame(t) {
  const dt = last ? (t - last) / 1000 : 0; last = t;
  budget += dt * (turbo ? 3000 : 10);
  let n = 0;
  while (budget >= 1 && queueOut.length) { budget--; out(queueOut.shift(), !turbo || n++ % 40 === 0); }
  if (!queueOut.length) budget = Math.min(budget, 1);
  if (scrollAnim > .3) { scrollAnim *= Math.pow(.0005, dt); dirty = true; } else scrollAnim = 0;
  if (Math.abs(viewTarget - viewOff) > .3) { viewOff += (viewTarget - viewOff) * Math.min(1, dt * 14); dirty = true; }
  else if (viewOff !== viewTarget) { viewOff = viewTarget; dirty = true; }
  if (Math.abs(MARGIN + Math.min(col, COLS - 1) * CW - headX) > .5) dirty = true;
  if (dirty) { render(); dirty = false; }
  requestAnimationFrame(frame);
}

// ---------- connection to the server ----------
function connect() {
  const es = new EventSource("/stream");
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.h !== undefined) { newPaper(); col = 0; queueOut.length = 0; for (const ch of m.h) out(ch, false); scrollAnim = 0; }
    if (m.d) for (const ch of m.d) queueOut.push(ch);
  };
}
let sending = Promise.resolve();
function send(str) { sending = sending.then(() => fetch("/key", { method: "POST", body: str }).catch(() => {})); }

// ---------- scrollback with the mouse wheel ----------
function scrollTo(px) {
  viewTarget = Math.max(0, Math.min(px, cur * LH));
  document.getElementById("back").style.display = viewTarget > 0 ? "block" : "none";
}
window.addEventListener("wheel", (e) => {
  if (e.target.closest && e.target.closest("#man")) return;   // the manual scrolls by itself
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * LH : e.deltaMode === 2 ? e.deltaY * H : e.deltaY;
  scrollTo(viewTarget - d);                    // wheel up = pull the paper down = read older text
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if (e.key === "F2") { e.preventDefault(); toggleMan(); return; }
  if (e.target.closest && e.target.closest("#man")) { if (e.key === "Escape") toggleMan(false); return; }
  if (e.key === "End" || e.key === "PageDown" && e.shiftKey) { e.preventDefault(); scrollTo(0); return; }
  if (e.key === "PageUp" && e.shiftKey) { e.preventDefault(); scrollTo(viewTarget + H * .6); return; }
  if (e.key === "F5") { e.preventDefault(); toggleTurbo(); return; }
  if (e.key === "F7") { e.preventDefault(); toggleLid(); return; }
  if (e.key === "F8" && SMP.cr.length) {         // try the next carriage-return sample
    e.preventDefault(); crChoice = (crChoice + 1) % SMP.cr.length;
    document.getElementById("crName").textContent = SMP.cr[crChoice].n; play("cr"); return;
  }
  if (e.metaKey || e.altKey) return;
  let s = null;
  if (e.ctrlKey && e.key.length === 1) s = String.fromCharCode(e.key.toUpperCase().charCodeAt(0) & 0x1f);
  else if (e.key === "Enter") s = "\r";
  else if (e.key === "Backspace") s = "#";      // v0: # erases the previous character
  else if (e.key === "Tab") s = "\t";
  else if (e.key === "Escape") s = "\x1b";
  else if (e.key.length === 1) s = e.key.toLowerCase();
  if (s !== null) { e.preventDefault(); scrollTo(0); send(s); }
});

function toggleTurbo() { turbo = !turbo; document.getElementById("bTurbo").classList.toggle("on", turbo); }
function toggleLid() { lid = !lid; document.getElementById("bLid").classList.toggle("on", lid); if (S.master) S.master.gain.value = lid ? .2 : .8; }
document.getElementById("bTurbo").onclick = (e) => { toggleTurbo(); e.target.blur(); };
document.getElementById("bLid").onclick = (e) => { toggleLid(); e.target.blur(); };
document.getElementById("back").onclick = () => scrollTo(0);

document.getElementById("bReset").onclick = (e) => {   // safety: the first click only asks
  const b = e.target; b.blur();
  if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Really restart?"; b.classList.add("on");
    setTimeout(() => { delete b.dataset.armed; b.textContent = "Restart computer"; b.classList.remove("on"); }, 3000); return; }
  delete b.dataset.armed; b.textContent = "Restart computer"; b.classList.remove("on");
  fetch("/reset", { method: "POST" });
};
document.getElementById("bPower").onclick = () => { initAudio(); document.getElementById("power").remove(); };


// ---------- Unix v0 manual side panel ----------
const V0_TIPS = [                              // [topic, text]; not part of the original manual
  ["V0 TIPS", "quick reference, not part of the original 1970 manual"],
  ["LOGIN", "ken/ken, dmr/dmr, doug/doug, system/system"],
  ["PROMPT", "@"],
  ["SHELL", "There is no PATH. Programs live in \"system\" and are linked into the current directory for each run, so commands only work in a directory you may write to."],
  ["ch name", "change directory (there is no cd)"],
  ["ch dd", "go to the root, the \"directory directory\""],
  ["..", "means THIS directory, not the parent. There are no / paths: walk one directory at a time via dd."],
  ["#", "erases the previous character (it stays visible on paper)"],
  ["@", "kills the whole line"],
  ["FILES", "ls, list (details), stat, cat, cp, mv, ln, rm, chmod, chown, od"],
  ["ed", "a (append text) ... . (end), p, 1,$p, /word/, w name, q. A reply of ? means error."],
  ["B LANGUAGE", "in dmr's directory: b hello.b hello.s, then as op.s bl.s hello.s bi.s, then a.out"],
  ["DO NOT", "run n.out - it is the assembler's symbol table, not a program. It hangs the machine; use Restart computer."],
  ["", "run init - it is the system's first process; a second copy fights the shell for the terminal."],
  ["LOG OUT", "there is no real logout (Ctrl+D is not end of input in v0); to switch users use Restart computer."],
];
const V0_TIPS_TEXT = V0_TIPS.map(([k, v]) => k + " " + v).join("\n");
let manPages = [], manSel = 0, manLoaded = false;
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

function roffToHtml(src) {                      // the small subset of 1970 roff these pages use
  const out = []; let fill = true, indent = 0, tabs = [], ul = 0, para = [], header = null;
  const flush = () => { if (para.length) { out.push(`<div class="para" style="margin-left:${indent}ch">${para.join(" ")}</div>`); para = []; } };
  const expand = (t) => { let o = "", ti = 0;
    for (const ch of t) { if (ch === "\t") { const stop = tabs.find((x) => x > o.length + indent) ?? (o.length + 8); o = o.padEnd(Math.max(o.length + 1, stop - indent)); } else o += ch; }
    return o; };
  for (const line of src.split("\n")) {
    if (line.startsWith(".")) {
      const cmd = line.slice(1, 3), arg = line.slice(3).trim();
      if (cmd === "oh") { const p = arg.split("'"); header = { l: p[1] || "", c: p[2] || "", r: p[3] || "" }; }
      else if (cmd === "ta") tabs = arg.split(/\s+/).map(Number).filter((n) => n > 0);
      else if (cmd === "sp") { flush(); out.push('<div class="sp"></div>'); }
      else if (cmd === "ul") ul = 1;
      else if (cmd === "in") { flush(); indent = parseInt(arg) || 0; }
      else if (cmd === "nf") { flush(); fill = false; }
      else if (cmd === "fi") { flush(); fill = true; }
      continue;
    }
    let t = esc(line);
    if (ul) { t = `<u>${t}</u>`; ul = 0; }
    if (!fill || line.includes("\t")) { flush(); out.push(`<div class="pre" style="margin-left:${indent}ch">${line.includes("\t") ? esc(expand(line)) : t}</div>`); }
    else if (line.trim() === "") { flush(); out.push('<div class="sp"></div>'); }
    else para.push(t);
  }
  flush();
  const h = header ? `<div class="hdr"><span>${esc(header.r)}</span><span>${esc(header.c)}</span><span>${esc(header.l)}</span></div>` : "";
  return h + out.join("");
}
const plain = (src) => src.split("\n").filter((l) => !l.startsWith(".")).join("\n");
const title = (n) => n.replace(/\.(\d)$/, "($1)");

async function loadMan() {
  if (manLoaded) return; manLoaded = true;
  let pages = [];
  try { pages = await (await fetch("/man.json")).json(); } catch (e) {}
  manPages = [{ name: "v0 tips", text: V0_TIPS_TEXT, tips: true }, ...pages];
  renderManList();
}
function renderManList() {
  const q = document.getElementById("manQ").value.trim().toLowerCase(), list = document.getElementById("manList");
  const hits = manPages.map((p, i) => {
    const body = (p.tips ? p.text : plain(p.text)).toLowerCase();
    const n = q ? body.split(q).length - 1 + (p.name.toLowerCase().includes(q) ? 1 : 0) : 0;
    return { p, i, n };
  }).filter((h) => !q || h.n > 0);
  list.innerHTML = hits.length ? "" : '<span class="none">nothing found</span>';
  for (const h of hits) {
    const b = document.createElement("button");
    b.innerHTML = esc(h.p.tips ? h.p.name : title(h.p.name)) + (q ? `<small>${h.n}</small>` : "");
    if (h.i === manSel) b.classList.add("sel");
    b.onclick = () => { manSel = h.i; renderManList(); };
    list.appendChild(b);
  }
  if (q && hits.length && !hits.some((h) => h.i === manSel)) { manSel = hits[0].i; return renderManList(); }
  showManPage(q);
}
function showManPage(q) {
  const el = document.getElementById("manPage"), p = manPages[manSel];
  if (!p) { el.textContent = "No manual pages found (set PDP7_UNIX_MAN)."; return; }
  el.innerHTML = p.tips ? V0_TIPS.map(([k, v], i) => `<div class="tips">${esc(k.padEnd(12))} ${esc(v)}</div>` + (i ? "" : '<div class="sp"></div>')).join("") : roffToHtml(p.text);
  if (!q) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  let first = null;
  for (const n of nodes) {
    const t = n.nodeValue, lo = t.toLowerCase(); let i = lo.indexOf(q); if (i < 0) continue;
    const frag = document.createDocumentFragment(); let last = 0;
    while (i >= 0) { frag.append(t.slice(last, i)); const m = document.createElement("mark"); m.textContent = t.slice(i, i + q.length); frag.append(m); first ??= m; last = i + q.length; i = lo.indexOf(q, last); }
    frag.append(t.slice(last)); n.replaceWith(frag);
  }
  if (first) first.scrollIntoView({ block: "center" });
}
function toggleMan(force) {
  const m = document.getElementById("man"), open = force ?? !m.classList.contains("open");
  m.classList.toggle("open", open); document.getElementById("bMan").classList.toggle("on", open);
  document.body.classList.toggle("manopen", open); resize();
  if (open) { loadMan(); setTimeout(() => document.getElementById("manQ").focus(), 50); }
  else document.getElementById("manQ").blur();
}
document.getElementById("bMan").onclick = (e) => { e.target.blur(); toggleMan(); };
document.getElementById("manClose").onclick = () => toggleMan(false);
document.getElementById("manQ").addEventListener("input", () => renderManList());

newPaper(); col = 0;
window.addEventListener("resize", resize); resize();
connect();
requestAnimationFrame(frame);
