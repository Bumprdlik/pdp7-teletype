    <text x="140" y="150">LOGIN:</text>
    <text x="140" y="214">KEN</text>
    <text x="140" y="300">@ LS</text>
  </g>
  <rect x="272" y="322" width="26" height="6" fill="#a77c2c"/>
  <rect x="40" y="404" width="432" height="68" rx="14" fill="#2a2824"/>
  <rect x="40" y="404" width="432" height="10" fill="#0d0d0c"/>
  <rect x="196" y="420" width="120" height="16" rx="6" fill="#5b5b5b"/>
</svg>
