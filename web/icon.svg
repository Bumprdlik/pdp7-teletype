<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- app icon of the browser-only build; web/icon-*.png are rendered from it:
       rsvg-convert -w 512 web/icon.svg -o web/icon-512.png  (and -w 192 / icon-192.png)
       Everything important stays inside the middle 80 % (the "maskable" safe zone). -->
